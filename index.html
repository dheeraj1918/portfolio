<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dheeraj Pabolu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #fafafa;
  color: #111;
  min-height: 100vh;
}

/* Top bar */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 40px 80px;
}

.logo {
  font-size: 18px;
  font-weight: 600;
}

nav a {
  margin-left: 30px;
  text-decoration: none;
  color: #444;
  font-size: 15px;
}

nav a:hover {
  color: #000;
}

/* Hero section */
.hero {
  max-width: 900px;
  margin: 120px auto 0;
  text-align: center;
  padding: 0 20px;
}

/* Badge */
.badge {
  display: inline-block;
  background: #f3c7bb;
  padding: 18px 40px;
  border-radius: 6px;
  margin-bottom: 50px;
  font-size: 18px;
}

.badge small {
  font-size: 14px;
  color: #555;
}

/* Main text */
.hero h2 {
  font-size: 48px;
  margin-bottom: 20px;
}

.hero p {
  font-size: 22px;
  color: #444;
  line-height: 1.6;
  margin-bottom: 40px;
}

/* Buttons */
.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.btn {
  padding: 14px 28px;
  border: 1px solid #000;
  text-decoration: none;
  color: #000;
  font-size: 16px;
}

.btn.primary {
  background: #000;
  color: #fff;
}

.btn:hover {
  transform: translateY(-3px);
  transition: 0.2s;
}

/* Mobile */
@media (max-width: 768px) {
  header {
    padding: 30px 20px;
    flex-direction: column;
    gap: 20px;
  }

  .hero h2 {
    font-size: 36px;
  }

  .hero p {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<header>
  <h1 class="logo">Dheeraj Pabolu</h1>
  <nav>
    <a href="info.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="start-up.html">Startups</a>
    <a href="mailto:subrahmanyadheeraj1918@gmail.com">Contact</a>
  </nav>
</header>

<main class="hero">
  

  <h2>Hi, I’m Dheeraj.</h2>
  <p>
    Hello, world! I'm studying Bachelor of Engineering in Computer Science in India.
  </p>

  <div class="buttons">
    <a href="projects.html" class="btn primary">View my work</a>
    <a href="info.html" class="btn">About me</a>
  </div>
</main>

</body>
</html>
